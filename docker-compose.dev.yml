services:
  postgres:
    image: postgres:15-alpine
    container_name: workload_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workload
      POSTGRES_PASSWORD: workload
      POSTGRES_DB: workload_dev
    ports:
      - "5432:5432"
    volumes:
      - workload_pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workload -d workload_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workload_pgdata:
